name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      # AI route tests stub api.anthropic.com locally (see src/lib/ai/*.test.ts)
      # — no ANTHROPIC_API_KEY secret needed.
      - run: npm test
      - name: Build (with placeholder env — DB/AI calls aren't exercised at build time)
        run: npm run build
        env:
          DATABASE_URL: "postgres://placeholder:placeholder@localhost:5432/placeholder"
          JWT_SECRET: "placeholder-ci-secret"
